import os
import requests
from openai import OpenAI

TELEGRAM_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")
OPENAI_KEY = os.getenv("OPENAI_API_KEY")

client = OpenAI(api_key=OPENAI_KEY)

def ask_gpt(prompt):
    response = client.responses.create(
        model="gpt-4.1-mini",
        input=prompt
    )
    return response.output_text

def send_telegram(text):
    url = f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage"
    payload = {
        "chat_id": CHAT_ID,
        "text": text,
        "parse_mode": "Markdown"
    }
    requests.post(url, json=payload)

def generate_analysis():
    prompt = """
Buat analisa fundamental HARIAN secara RINGKAS & PROFESIONAL untuk:

- XAUUSD
- EURUSD
- GBPUSD
- BTCUSD

Gunakan struktur:
1. Kondisi USD & Sentimen Global
2. Bank Sentral (Fed, ECB, BoE)
3. Data Inflasi & Suku Bunga
4. Geopolitik / Risk Sentiment
5. Event besar terdekat (FOMC / CPI / NFP jika ada)

Tambahkan:
- Bias trading singkat (Bullish / Bearish / Neutral)
- Fokus ke FOMC tanggal 31 jika relevan

Bahasa Indonesia.
Tidak overclaim. Tidak beri entry price.
"""
    return ask_gpt(prompt)

if __name__ == "__main__":
    analysis = generate_analysis()
    send_telegram("📊 *Fundamental Market Update*\n\n" + analysis)
